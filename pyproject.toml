[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opds-mirror"
version = "0.1.0"
description = "Mirror every book from one or more OPDS catalogs into an {Author}/{Title} folder tree."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",
    "defusedxml>=0.7",
    "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
opds-mirror = "opds_mirror.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
